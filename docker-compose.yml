# External interface simulators (MOM / IoT / ESB / CV) — isolated stack on its own bridge network.
# Public ports (host): MOM 18001, IoT HTTP 18002, ESB 18003, CV 18004, MQTT broker 18830.
name: interface-simulators

x-sim-common: &sim-common
  image: interface-simulators:local
  build: .
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./state:/state
  networks: [simnet]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: sim-mqtt
    restart: unless-stopped
    ports:
      - "0.0.0.0:18830:1883"
    volumes:
      - ./iot/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./iot/mosquitto/acl:/mosquitto/config/acl:ro
      - ./iot/mosquitto/passwd:/mosquitto/config/passwd:ro
    networks: [simnet]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$IOT_MQTT_SUB_USER\" -P \"$$IOT_MQTT_SUB_PASS\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    env_file: .env
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  mom:
    <<: *sim-common
    container_name: sim-mom
    command: ["uvicorn", "mom.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "0.0.0.0:18001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/_sim/health',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  iot:
    <<: *sim-common
    container_name: sim-iot
    command: ["uvicorn", "iot.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "0.0.0.0:18002:8000"
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/_sim/health',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  esb:
    <<: *sim-common
    container_name: sim-esb
    command: ["uvicorn", "esb.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "0.0.0.0:18003:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/_sim/health',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  cv:
    <<: *sim-common
    container_name: sim-cv
    command: ["uvicorn", "cv.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "0.0.0.0:18004:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/_sim/health',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  simnet:
    name: interface-simulators-net
    driver: bridge
