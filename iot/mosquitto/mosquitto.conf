# Mosquitto 2.x configuration for the IoT simulator broker (IF-IOT-MQTT-001).
# MQTT 3.1.1 over TCP, username/password auth, no anonymous access, topic ACL.
listener 1883 0.0.0.0
protocol mqtt
accept_protocol_versions 3, 4, 5
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
retain_available true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
max_connections -1
